<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbre des Ouvertures — vue arbre</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #14142a;
  --bg2: #1a1a2e;
  --bg-card: #1c2a4a;
  --bg-elevated: #24355e;
  --accent: #e2b857;
  --accent-dim: #c9982e;
  --text: #edf0f5;
  --text-dim: #8892a4;
  --line: #2a3a5c;
  --square-light: #ebd7b2;
  --square-dark: #ae8a68;
  --radius: 14px;
  --fam-open: #4ade80;
  --fam-semiopen: #60a5fa;
  --fam-closed: #c084fc;
  --fam-semiclosed: #22d3ee;
  --fam-flank: #fb923c;
  --fam-none: #6b7a99;
}
html, body {
  font-family: 'Inter', system-ui, sans-serif;
  background: radial-gradient(1200px 600px at 20% -5%, #1e2b52 0%, var(--bg) 55%);
  color: var(--text);
  height: 100vh; overflow: hidden;
}
header {
  padding: 14px 22px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  background: rgba(20,20,42,.7); backdrop-filter: blur(6px);
}
header .logo { font-size: 28px; }
header h1 { font-size: 19px; font-weight: 800; color: var(--accent); letter-spacing: .2px; }
header p { color: var(--text-dim); font-size: 12.5px; margin-top: 1px; }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  font-size: 12.5px; font-weight: 600; color: var(--text);
  background: var(--bg-card); border: 1px solid var(--line);
  padding: 7px 13px; border-radius: 9px; cursor: pointer; transition: .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }

.legend { display: flex; gap: 7px; flex-wrap: wrap; }
.legend .chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-dim);
  background: var(--bg-card); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: 999px; cursor: pointer; transition: .15s; user-select: none;
}
.legend .chip:hover { color: var(--text); }
.legend .chip.off { opacity: .3; }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; }

/* ── canvas ── */
.canvas {
  position: absolute; inset: 0; top: 0;
  overflow: auto; padding: 40px 60px 260px;
  cursor: grab;
}
.canvas.grabbing { cursor: grabbing; }
.content { position: relative; display: inline-block; min-width: 100%; }
svg.links { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; overflow: visible; }

/* ── tree layout (horizontal) ── */
.subtree { display: flex; align-items: center; }
.kids {
  display: flex; flex-direction: column; gap: 16px;
  margin-left: 72px; padding: 8px 0;
}
.subtree.collapsed > .kids { display: none; }

.card {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 11px;
  background: linear-gradient(180deg, var(--bg-card), #182543);
  border: 1px solid var(--line);
  border-left: 5px solid var(--fam, var(--fam-none));
  border-radius: 13px; padding: 11px 14px;
  min-width: 172px; max-width: 250px; cursor: pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
  transition: transform .12s, box-shadow .15s, border-color .15s;
  animation: pop .25s ease both;
}
@keyframes pop { from { opacity: 0; transform: translateX(-8px) scale(.96); } to { opacity: 1; } }
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.45); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset, 0 10px 26px rgba(0,0,0,.5); }
.card.root { --fam: var(--accent); }

.card .ic {
  font-size: 26px; width: 40px; height: 40px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.05); border-radius: 10px;
}
.card .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card .tt { font-weight: 700; font-size: 14px; line-height: 1.18; }
.card .sub { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card .mv {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 11.5px;
  color: var(--accent); background: rgba(226,184,87,.12);
  padding: 1px 7px; border-radius: 5px;
}
.card .eco { font-size: 10.5px; color: var(--text-dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; letter-spacing: .03em; }
.chev {
  position: absolute; right: -13px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; z-index: 3;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-elevated); border: 1px solid var(--line);
  border-radius: 50%; font-size: 11px; color: var(--accent); cursor: pointer;
  transition: .15s;
}
.chev:hover { background: var(--accent); color: #14142a; }
.subtree.collapsed > .card .chev { transform: translateY(-50%) rotate(180deg); }
.card.hidden-fam { display: none; }

/* ── detail bar ── */
.detail {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; gap: 18px; align-items: center;
  padding: 14px 22px;
  background: rgba(16,18,38,.92); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  min-height: 150px;
}
.detail .board {
  width: 132px; height: 132px; flex: none;
  display: grid; grid-template-columns: repeat(8,1fr);
  border-radius: 7px; overflow: hidden; border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(0,0,0,.4);
}
.sq { display: flex; align-items: center; justify-content: center; position: relative; }
.sq.light { background: var(--square-light); }
.sq.dark { background: var(--square-dark); }
.sq.hl::after { content: ''; position: absolute; inset: 0; background: rgba(226,184,87,.45); }
.sq span { font-size: 15px; line-height: 1; z-index: 1; }
.sq .w { color: #fbfbf7; text-shadow: 0 1px 1px rgba(0,0,0,.55); }
.sq .b { color: #26324a; text-shadow: 0 1px 0 rgba(255,255,255,.25); }

.detail .txt { flex: 1; min-width: 0; }
.detail .txt h2 { font-size: 18px; display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
.detail .txt .metarow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.detail .path { font-size: 12.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.detail .path b { color: var(--accent); font-weight: 600; }
.detail .idea { font-size: 13px; line-height: 1.5; color: var(--text); max-width: 720px; }
.detail .idea .k { color: var(--accent); font-weight: 600; }
.pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.hint { color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="logo">🌳</div>
  <div>
    <h1>Arbre des Ouvertures</h1>
    <p>Clique une carte pour explorer · glisse le fond pour te déplacer</p>
  </div>
  <div class="tools">
    <div class="legend" id="legend"></div>
    <button class="btn" id="expandAll">Tout déplier</button>
    <button class="btn" id="collapseAll">Replier</button>
  </div>
</header>

<div class="canvas" id="canvas">
  <div class="content" id="content">
    <svg class="links" id="links"></svg>
    <div id="tree"></div>
  </div>
</div>

<div class="detail" id="detail"></div>

<script>
const FAM = {
  open:       { name: 'Ouvertes',      color: '#4ade80' },

const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';

const TREE = {
  mv: null, icon: '🏁', lbl: 'Position de départ', fen: START,

  kids: [
    { mv: '1.e4', icon: '⚔️', lbl: 'Pion roi', fen: 'rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR',

      kids: [
        { mv: '1...e5', icon: '🔓', lbl: 'Jeux ouverts', fam: 'open', fen: 'rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR',
          idea: "Réponse symétrique : les deux camps se disputent le centre frontalement → <span class='k'>jeux ouverts</span>, riches en tactique.",
          kids: [
            { mv: '2.Cf3', icon: '♞', lbl: 'Cavalier roi', fen: 'rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R',
              idea: "Menace immédiatement e5 : le coup le plus naturel.",
              kids: [
                { mv: '2...Cc6', icon: '🛡️', lbl: 'Défense de e5', fen: 'r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R',
                  idea: "Carrefour des grandes ouvertes : les Noirs défendent e5 et développent.",
                  kids: [
                    { mv: '3.Fb5', icon: '🇪🇸', lbl: 'Espagnole (Ruy Lopez)', eco: 'C60–C99', fen: 'r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R',
                      idea: "Le fou attaque le défenseur de e5. L'ouverture la plus profonde du répertoire classique : pression durable, jeu positionnel." },
                    { mv: '3.Fc4', icon: '🇮🇹', lbl: 'Italienne', eco: 'C50–C54', fen: 'r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R',
                      idea: "Le fou vise f7, le point faible. Développement rapide, parfaite pour apprendre les principes d'ouverture." },
                    { mv: '3.d4', icon: '🏴', lbl: 'Écossaise', eco: 'C44–C45', fen: 'r1bqkbnr/pppp1ppp/2n5/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R',
                      idea: "Ouvre le centre tout de suite : jeu clair et actif, peu de théorie." },
                  ]},
              ]},
            { mv: '2.f4', icon: '🔥', lbl: 'Gambit du Roi', eco: 'C30–C39', fen: 'rnbqkbnr/pppp1ppp/8/4p3/4PP2/8/PPPP2PPP/RNBQKBNR',
              idea: "Sacrifie un pion pour un développement fulgurant et l'ouverture de la colonne f. Romantique et tranchant." },
          ]},
        { mv: '1...c5', icon: '🌋', lbl: 'Sicilienne', fam: 'semiopen', eco: 'B20–B99', fen: 'rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR',
          idea: "La réponse la plus combative à 1.e4. Jeu asymétrique → <span class='k'>semi-ouvert</span>, contre-jeu sur l'aile dame.",
          kids: [
            { mv: '2.Cf3 d6 3.d4', icon: '🗡️', lbl: 'Sicilienne ouverte', eco: 'B30–B99', fen: 'rnbqkb1r/pp2pppp/3p1n2/8/3NP3/8/PPP2PPP/RNBQKB1R',
              idea: "Les Blancs ouvrent le centre. Najdorf, Dragon, Scheveningen en découlent." },
          ]},
        { mv: '1...e6', icon: '🇫🇷', lbl: 'Française', fam: 'semiopen', eco: 'C00–C19', fen: 'rnbqkbnr/pppp1ppp/4p3/8/4P3/8/PPPP1PPP/RNBQKBNR',
          idea: "Solide mais un peu passive : le fou de cases blanches reste enfermé. Prépare d5, structures fermées." },
        { mv: '1...c6', icon: '🧱', lbl: 'Caro-Kann', fam: 'semiopen', eco: 'B10–B19', fen: 'rnbqkbnr/pp1ppppp/2p5/8/4P3/8/PPPP1PPP/RNBQKBNR',
          idea: "Comme la française mais sans enfermer le fou. Très solide, chère aux joueurs positionnels." },
        { mv: '1...d5', icon: '❄️', lbl: 'Scandinave', fam: 'semiopen', eco: 'B01', fen: 'rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR',
          idea: "Défie e4 tout de suite. Après 2.exd5 Dxd5, la dame sort tôt : simple, peu de théorie." },
      ]},
    { mv: '1.d4', icon: '🏛️', lbl: 'Pion dame', fen: 'rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR',
      idea: "Le pion d4 est défendu par la dame : centre plus stable, jeu plus lent et stratégique.",
      kids: [
        { mv: '1...d5', icon: '🔒', lbl: 'Jeux fermés', fam: 'closed', fen: 'rnbqkbnr/ppp1pppp/8/3p4/3P4/8/PPP1PPPP/RNBQKBNR',
          idea: "Réponse symétrique, centre verrouillé → <span class='k'>jeux fermés</span> : la stratégie prime sur la tactique.",
          kids: [
            { mv: '2.c4', icon: '💎', lbl: 'Gambit dame', eco: 'D06–D69', fen: 'rnbqkbnr/ppp1pppp/8/3p4/2PP4/8/PP2PPPP/RNBQKBNR',
              idea: "Offre le pion c pour dévier d5 et dominer le centre. Faux sacrifice : le pion se récupère.",
              kids: [
                { mv: '2...dxc4', icon: '🤝', lbl: 'GD accepté', eco: 'D20–D29', fen: 'rnbqkbnr/ppp1pppp/8/8/2pP4/8/PP2PPPP/RNBQKBNR',
                  idea: "Les Noirs prennent mais rendront le pion ; les Blancs obtiennent un centre mobile." },
                { mv: '2...e6', icon: '🚫', lbl: 'GD refusé', eco: 'D30–D69', fen: 'rnbqkbnr/ppp2ppp/4p3/3p4/2PP4/8/PP2PPPP/RNBQKBNR',
                  idea: "Solide et classique : structure rigide, plan clair (attaque de minorité)." },
                { mv: '2...c6', icon: '🐻', lbl: 'Défense slave', eco: 'D10–D19', fen: 'rnbqkbnr/pp2pppp/2p5/3p4/2PP4/8/PP2PPPP/RNBQKBNR',
                  idea: "Renforce d5 sans enfermer le fou de cases blanches. Très fiable au plus haut niveau." },
              ]},
          ]},
        { mv: '1...Cf6', icon: '🧩', lbl: 'Jeux semi-fermés', fam: 'semiclosed', fen: 'rnbqkb1r/pppppppp/5n2/8/3P4/8/PPP1PPPP/RNBQKBNR',
          idea: "Les Noirs refusent la symétrie, laissent le centre aux Blancs pour l'attaquer ensuite (hypermoderne) → <span class='k'>semi-fermés</span>.",
          kids: [
            { mv: '2.c4 e6 3.Cc3 Fb4', icon: '📌', lbl: 'Nimzo-indienne', eco: 'E20–E59', fen: 'rnbqk2r/pppp1ppp/4pn2/8/1bPP4/2N5/PP2PPPP/R1BQKBNR',
              idea: "Le fou cloue Cc3 et vise à doubler les pions blancs. Équilibre solidité / jeu de pièces." },
            { mv: '2.c4 g6 3.Cc3 Fg7', icon: '🏹', lbl: 'Est-indienne / Grünfeld', eco: 'E60–E99', fen: 'rnbqk2r/ppppppbp/5np1/8/2PP4/2N5/PP2PPPP/R1BQKBNR',
              idea: "Fianchetto : on laisse un gros centre blanc… pour le bombarder. Contre-attaque tranchante." },
          ]},
        { mv: '1...f5', icon: '🌷', lbl: 'Hollandaise', fam: 'semiclosed', eco: 'A80–A99', fen: 'rnbqkbnr/ppppp1pp/8/5p2/3P4/8/PPP1PPPP/RNBQKBNR',
          idea: "Vise l'attaque sur l'aile roi (case e4). Ambitieuse, mais affaiblit un peu le roque." },
      ]},
    { mv: '1.c4', icon: '🇬🇧', lbl: 'Anglaise', fam: 'flank', eco: 'A10–A39', fen: 'rnbqkbnr/pppppppp/8/8/2P5/8/PP1PPPPP/RNBQKBNR',
      idea: "Ouverture de <span class='k'>flanc</span> : contrôle d5 à distance sans avancer de pion central. Transpose souvent." },
    { mv: '1.Cf3', icon: '🐎', lbl: 'Réti', fam: 'flank', eco: 'A04–A09', fen: 'rnbqkbnr/pppppppp/8/8/8/5N2/PPPPPPPP/RNBQKBNR',
      idea: "Flexible et hypermoderne : développe avant de fixer la structure. Peut transposer partout." },
  ]
};

// ── FEN board ──
const GLYPH = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
function sqFromFen(fen){ const rows=fen.split(' ')[0].split('/'), out=[]; for(let r=0;r<8;r++){ for(const ch of rows[r]){ if(/\d/.test(ch)){for(let i=0;i<+ch;i++)out.push(null);} else out.push(ch);} } return out; }
function changed(a,b){ const A=sqFromFen(a),B=sqFromFen(b),s=new Set(); for(let i=0;i<64;i++) if(A[i]!==B[i]) s.add(i); return s; }
function renderBoard(host, fen, prev){
  host.innerHTML=''; const sq=sqFromFen(fen), hl=prev?changed(prev,fen):new Set();
  for(let i=0;i<64;i++){ const r=Math.floor(i/8),c=i%8, d=document.createElement('div');
    d.className='sq '+(((r+c)%2===0)?'light':'dark')+(hl.has(i)?' hl':'');
    const p=sq[i]; if(p){ const w=p===p.toUpperCase(); d.innerHTML=`<span class="${w?'w':'b'}">${GLYPH[p.toLowerCase()]}</span>`; }
    host.appendChild(d);
  }
}

// ── build tree ──
let selectedCard=null;
const famColor=f=>f?FAM[f].color:'var(--fam-none)';

function build(node, parentFam, depth){
  const fam=node.fam||parentFam||null;
  const st=document.createElement('div'); st.className='subtree';
  if(depth>=1 && node.kids) st.classList.add('collapsed'); // open root+level1 only
  const card=document.createElement('div');
  card.className='card'+(depth===0?' root':'');
  card.style.setProperty('--fam',famColor(fam));
  card.dataset.fam=node.fam||'';
  const eco=node.eco?`<span class="eco">${node.eco}</span>`:'';
  const mv=node.mv?`<span class="mv">${node.mv}</span>`:'';
  card.innerHTML=`<div class="ic">${node.icon||'♟️'}</div>
    <div class="body"><div class="tt">${node.lbl}</div><div class="sub">${mv}${eco}</div></div>`;
  const hasKids=node.kids&&node.kids.length;
  if(hasKids){ const ch=document.createElement('div'); ch.className='chev'; ch.textContent='◀';
    ch.addEventListener('click',e=>{ e.stopPropagation(); st.classList.toggle('collapsed'); draw(); });
    card.appendChild(ch);
  }
  card.addEventListener('click',()=>{ if(hasKids) st.classList.remove('collapsed'); select(node,fam,card); draw(); });
  st.appendChild(card);
  if(hasKids){ const kids=document.createElement('div'); kids.className='kids';
    node.kids.forEach(k=>kids.appendChild(build(k,fam,depth+1))); st.appendChild(kids);
  }
  st._node=node;
  return st;
}

function findPath(node,target,acc=[]){ const here=[...acc,node]; if(node===target) return here;
  if(node.kids) for(const k of node.kids){ const r=findPath(k,target,here); if(r) return r; } return null; }

function select(node,fam,card){
  if(selectedCard) selectedCard.classList.remove('selected');
  card.classList.add('selected'); selectedCard=card;
  const path=findPath(TREE,node)||[node];
  const prev=path.length>=2?path[path.length-2].fen:null;
  const moves=path.filter(n=>n.mv).map(n=>n.mv).join('  ');
  const famTag=fam?`<span class="pill" style="background:${famColor(fam)}22;color:${famColor(fam)}">${FAM[fam].name}</span>`:'';
  const eco=node.eco?`<span class="eco">${node.eco}</span>`:'';
  const detail=document.getElementById('detail');
  detail.innerHTML=`<div class="board" id="dboard"></div>
    <div class="txt">
      <h2>${node.icon||''} ${node.lbl}</h2>
      <div class="metarow">${famTag}${eco}<span class="path">${moves?moves.replace(/(\d+\.(?:\.\.)?)/g,'<b>$1</b>'):'position de départ'}</span></div>
      <div class="idea">${node.idea||''}</div>
    </div>`;
  renderBoard(document.getElementById('dboard'),node.fen,prev);
}

// ── connectors ──
function draw(){
  const svg=document.getElementById('links'), content=document.getElementById('content');
  const base=content.getBoundingClientRect();
  svg.setAttribute('width',content.scrollWidth); svg.setAttribute('height',content.scrollHeight);
  let d='';
  content.querySelectorAll('.subtree').forEach(st=>{
    if(st.classList.contains('collapsed')) return;
    const pc=st.querySelector(':scope > .card');
    if(!pc || pc.offsetParent===null) return;
    const kids=st.querySelectorAll(':scope > .kids > .subtree > .card');
    const pr=pc.getBoundingClientRect();
    const px=pr.right-base.left, py=pr.top-base.top+pr.height/2;
    kids.forEach(kc=>{
      const kr=kc.getBoundingClientRect();
      const cx=kr.left-base.left, cy=kr.top-base.top+kr.height/2;
      const dx=Math.max(24,(cx-px)/2);
      const fam=kc.dataset.fam;
      const col=fam?FAM[fam].color:'#6b7a99';
      d+=`<path d="M ${px} ${py} C ${px+dx} ${py}, ${cx-dx} ${cy}, ${cx} ${cy}" fill="none" stroke="${col}" stroke-width="2.5" stroke-opacity="0.55"/>`;
    });
  });
  svg.innerHTML=d;
}

// ── legend filter ──
const active=new Set(Object.keys(FAM));
function buildLegend(){
  const el=document.getElementById('legend');
  Object.entries(FAM).forEach(([k,f])=>{
    const c=document.createElement('div'); c.className='chip';
    c.innerHTML=`<span class="dot" style="background:${f.color}"></span>${f.name}`;
    c.addEventListener('click',()=>{ active.has(k)?(active.delete(k),c.classList.add('off')):(active.add(k),c.classList.remove('off')); applyFilter(); });
    el.appendChild(c);
  });
}
function applyFilter(){
  document.querySelectorAll('.card').forEach(c=>{ const f=c.dataset.fam; if(!f) return; c.classList.toggle('hidden-fam',!active.has(f)); });
  draw();
}

// ── drag to pan ──
function enablePan(){
  const cv=document.getElementById('canvas'); let down=false,sx,sy,sl,stp;
  cv.addEventListener('mousedown',e=>{ if(e.target.closest('.card')||e.target.closest('.chip')||e.target.closest('.btn')) return;
    down=true; cv.classList.add('grabbing'); sx=e.clientX; sy=e.clientY; sl=cv.scrollLeft; stp=cv.scrollTop; });
  window.addEventListener('mousemove',e=>{ if(!down) return; cv.scrollLeft=sl-(e.clientX-sx); cv.scrollTop=stp-(e.clientY-sy); });
  window.addEventListener('mouseup',()=>{ down=false; cv.classList.remove('grabbing'); });
  cv.addEventListener('scroll',draw);
}

// ── init ──
document.getElementById('tree').appendChild(build(TREE,null,0));
buildLegend(); enablePan();
function boot(){ draw(); select(TREE,null,document.querySelector('.card.root')); draw(); }
requestAnimationFrame(boot);
window.addEventListener('load',()=>{ draw(); if(!document.querySelector('.card.selected')) boot(); });
window.addEventListener('resize',draw);
document.getElementById('expandAll').addEventListener('click',()=>{ document.querySelectorAll('.subtree').forEach(s=>s.classList.remove('collapsed')); draw(); });
document.getElementById('collapseAll').addEventListener('click',()=>{ document.querySelectorAll('.subtree').forEach((s,i)=>{ if(s._node && s._node.mv!==null && s.querySelector(':scope>.kids')) s.classList.add('collapsed'); }); draw(); });
</script>
</body>
